name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Vercel auto-deploys to production on every push to main via GitHub Integration.
# This workflow handles code quality checks only.

jobs:
  ci:
    name: Type-check · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint --if-present
        continue-on-error: true

      - name: Run tests
        run: npm test -- --run --passWithNoTests

      - name: Build verification
        run: npm run build
