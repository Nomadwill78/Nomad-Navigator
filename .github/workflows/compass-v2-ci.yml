name: Compass v2 checks

on:
  push:
    branches:
      - main
    paths:
      - 'compass-v2/**'
      - '.github/workflows/compass-v2-ci.yml'
  pull_request:
    paths:
      - 'compass-v2/**'
      - '.github/workflows/compass-v2-ci.yml'

permissions:
  contents: read

concurrency:
  group: compass-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compass-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: compass-v2/.nvmrc
          cache: yarn
          cache-dependency-path: compass-v2/yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Tests (no Twenty server needed)
        run: yarn test:unit

      - name: Build and validate the whole app
        run: yarn twenty dev:build
