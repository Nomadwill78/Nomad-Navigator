name: Validate Nomad Compass

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, chore/standardize-plan-seat-limits]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run lint

      - name: Application tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Firestore security rules tests
        run: npm run test:rules
